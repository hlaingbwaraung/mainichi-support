plugins {
    id "com.android.application"
}

def appIdOverride = project.findProperty("applicationIdOverride")
def versionCodeOverride = project.findProperty("versionCodeOverride")
def versionNameOverride = project.findProperty("versionNameOverride")

android {
    namespace = "com.example.seniorhelper"
    compileSdk = 35

    defaultConfig {
        applicationId = appIdOverride != null ? appIdOverride.toString() : "com.example.seniorhelper"
        minSdk = 23
        targetSdk = 35
        versionCode = (versionCodeOverride != null ? versionCodeOverride.toString() : "1").toInteger()
        versionName = versionNameOverride != null ? versionNameOverride.toString() : "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
